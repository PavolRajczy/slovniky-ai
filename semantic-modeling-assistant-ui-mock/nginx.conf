server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # LLM-backed endpoints can run for several minutes.
    client_max_body_size 50m;

    # No URI part in proxy_pass: the request URI is forwarded as received.
    # With one, nginx decodes it and merges slashes, which breaks document IDs
    # such as https%3A%2F%2F... in DELETE /api/.../knowledge-base/legal/{id}.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
